name: Build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      dist:
        description: "sdist or wheel"
        required: true
        type: string

env:
  ISPC_VERSION: "1.32.0" # renovate: datasource=github-tags depName=ispc/ispc

jobs:
  build:
    name: Build ${{ inputs.dist }} (${{ inputs.os }})
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64

      - name: Setup ISPC
        if: inputs.dist == 'wheel'
        uses: ispc/install-ispc-action@4c5bedd28eb3d08ab9dd1c93b9401e498fd7aa8b # main
        with:
          version: ${{ env.ISPC_VERSION }}

      - name: Build ${{ inputs.dist }}
        run: uv build --${{ inputs.dist }}

      - name: Repair wheel (Linux)
        if: runner.os == 'Linux' && inputs.dist == 'wheel'
        run: |
          uvx --with patchelf auditwheel repair --strip dist/*.whl -w repaired_wheels
          rm dist/*.whl
          mv repaired_wheels/*.whl dist/

      - name: Repair wheel (macOS)
        if: runner.os == 'macOS' && inputs.dist == 'wheel'
        run: |
          uvx --from delocate delocate-wheel -v dist/*.whl -w repaired_wheels
          rm dist/*.whl
          mv repaired_wheels/*.whl dist/
          uvx --from delocate delocate-listdeps dist/*.whl

      - name: Upload ${{ inputs.dist }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ inputs.dist }}-${{ inputs.os }}
          path: dist/${{ inputs.dist == 'sdist' && '*.tar.gz' || '*.whl' }}
