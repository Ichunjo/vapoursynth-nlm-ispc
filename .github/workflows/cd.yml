name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-sdist:
    uses: ./.github/workflows/cd-build.yml
    with:
      os: ubuntu-slim
      dist: sdist

  build-windows:
    uses: ./.github/workflows/cd-build.yml
    with:
      os: windows-2025-vs2026
      dist: wheel

  build-linux-x64:
    uses: ./.github/workflows/cd-build.yml
    with:
      os: ubuntu-24.04
      dist: wheel

  build-linux-arm64:
    uses: ./.github/workflows/cd-build.yml
    with:
      os: ubuntu-24.04-arm
      dist: wheel

  build-macos-x64:
    uses: ./.github/workflows/cd-build.yml
    with:
      os: macos-26-intel
      dist: wheel

  build-macos-arm64:
    uses: ./.github/workflows/cd-build.yml
    with:
      os: macos-26
      dist: wheel

  publish:
    name: Publish PyPI
    needs:
      - build-sdist
      - build-windows
      - build-linux-x64
      - build-linux-arm64
      - build-macos-x64
      - build-macos-arm64
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/vapoursynth-nlm-ispc

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
