[build-system]
requires = [
    "scikit-build-core>=1.0.3",
    "setuptools-scm>=10.2.1",
    "vapoursynth>=79",
]
build-backend = "scikit_build_core.build"

[project]
name = "vapoursynth-nlm-ispc"
dynamic = ["version"]
description = "Non-local means denoise filter for VapourSynth (ISPC, CPU only)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "WolframRhodium" }]
maintainers = [
    { name = "WolframRhodium" },
    { name = "Vardë", email = "ichunjo.le.terrible@gmail.com" },
]
dependencies = ["vapoursynth>=79"]

[dependency-groups]
dev = [
    "scikit-build-core>=1.0.3",
    "setuptools-scm>=10.2.1",
    "vapoursynth>=79",
    "cmake>=4.4.2",
    "ninja>=1.13.0",
    "gersemi>=0.28.1",
]

[project.urls]
"Source Code" = "https://github.com/AmusementClub/vs-nlm-ispc"
"Bug Tracker" = "https://github.com/AmusementClub/vs-nlm-ispc/issues"

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["source/**", "CMakeLists.txt", "README.md", "LICENSE"]
wheel.py-api = "py3"
cmake.args = ["-G", "Ninja"]
ninja.make-fallback = false

[tool.setuptools_scm]
tag_regex = '^v(?P<version>.*)$'
