[build-system]
requires = [
    "scikit-build-core>=1.0.3",
    "setuptools-scm>=10.2.1",
    "vapoursynth>=79",
]
build-backend = "scikit_build_core.build"

[project]
name = "vapoursynth-nlm-ispc"
dynamic = ["version"]
description = """
Non-local means denoise filter,
drop-in replacement of the venerable KNLMeansCL for VapourSynth,
but without the OpenCL dependency (CPU only)
"""
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "WolframRhodium" }]
maintainers = [
    { name = "WolframRhodium" },
    { name = "Vardë", email = "ichunjo.le.terrible@gmail.com" },
]
dependencies = ["vapoursynth>=79"]

[dependency-groups]
dev = [
    "scikit-build-core>=1.0.3",
    "setuptools-scm>=10.2.1",
    "vapoursynth>=79",
    "cmake>=4.4.2",
    "ninja>=1.13.0",
]

[project.urls]
"Source Code" = "https://github.com/AmusementClub/vs-nlm-ispc"
"Bug Tracker" = "https://github.com/AmusementClub/vs-nlm-ispc/issues"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.scikit-build]
cmake.args = ["-G", "Ninja"]
ninja.make-fallback = false
sdist.include = [
    "source/**",
    "CMakeLists.txt",
    "README.md",
    "LICENSE",
]
wheel.py-api = "py3"

[tool.setuptools_scm]
tag_regex = '^v(?P<version>.*)$'

[tool.setuptools_scm.tag]
strict = false
